<!DOCTYPE html>
<html lang="en">
<head>
<title>Sign Up - Wealtace Investment</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="UTF-8">
<style>
:root{--usa-blue:#002B7F; --usa-red:#CE1126; --usa-green:#28a745; --bg:#F0F4FF;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh}

.box{background:#fff;width:90%;max-width:420px;padding:35px;border-radius:16px;box-shadow:0 8px 30px rgba(0,43,127,0.15);border-top:6px solid var(--usa-blue)}
.box h2{text-align:center;color:var(--usa-blue);margin-bottom:8px;font-size:26px}
.box p{text-align:center;color:#666;margin-bottom:25px;font-size:14px}

.form-group{margin:15px 0}
.form-group label{display:block;color:var(--usa-blue);font-weight:bold;margin-bottom:6px;font-size:14px}
.form-group input{width:100%;padding:14px;border:2px solid #ddd;border-radius:10px;font-size:15px}
.form-group input:focus{border-color:var(--usa-blue);outline:none}

.btn{width:100%;padding:15px;background:var(--usa-blue);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn:hover{background:#001f5c}

.link{text-align:center;margin-top:20px;font-size:14px}
.link a{color:var(--usa-red);font-weight:bold;text-decoration:none}

.note{background:#D4EDDA;border-left:4px solid var(--usa-green);padding:12px;border-radius:8px;color:#155724;margin-bottom:15px;font-size:13px}
</style>
</head>
<body>

<div class="box">
  <h2>Create Account</h2>
  <p>Join Wealtace Investment Today</p>
  
  <div class="note">✅ 100% Secure | USA Registered Company</div>

  <form onsubmit="signup(event)">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" required>
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" required>
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" id="phone" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" minlength="6" required>
    </div>
    <button class="btn">Create Account</button>
  </form>

  <div class="link">Already have an account? <a href="login.html">Login Here</a></div>
</div>

<script>
function signup(e){
  e.preventDefault();
  let user = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    phone: document.getElementById("phone").value,
    password: document.getElementById("password").value,
    balance: "0.00"
  };
  localStorage.setItem("wealtace_user", JSON.stringify(user));
  localStorage.setItem("wealtace_email", user.email);
  localStorage.setItem("wealtace_balance", "0.00");
  alert("Account Created Successfully!");
  window.location.href = "dashboard.html";
}
</script>

</body>
</html>
