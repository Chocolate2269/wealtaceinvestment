<!DOCTYPE html><html><head><title>Signup</title>
<style>body{background:#0A0A0A;color:#fff;padding:30px;text-align:center}
input,button{padding:10px;margin:8px;width:250px;border-radius:5px;border:none}
button{background:#D4AF37;color:#000;font-weight:bold}</style></head><body>
<h2>Join WEALTACE</h2>
<input id="name" placeholder="Full Name"><br>
<input id="email" placeholder="Email"><br>
<input id="password" type="password" placeholder="Password"><br>
<button onclick="signup()">Sign Up</button>

<script>
function signup(){
  let users = JSON.parse(localStorage.getItem('allUsers')) || [];
  users.push({name:name.value,email:email.value,password:password.value,balance:0});
  localStorage.setItem('allUsers',JSON.stringify(users));
  localStorage.setItem('currentUser',email.value);
  alert("Account Created!");
  window.location.href="dashboard.html";
}
</script></body></html>
