<!DOCTYPE html>
<html lang="en">
<head>
<title>Login - Wealtace Investment</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="UTF-8">
<style>
:root{--usa-blue:#002B7F; --usa-red:#CE1126; --usa-green:#28a745; --bg:#F0F4FF;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh}

.box{background:#fff;width:90%;max-width:420px;padding:35px;border-radius:16px;box-shadow:0 8px 30px rgba(0,43,127,0.15);border-top:6px solid var(--usa-red)}
.box h2{text-align:center;color:var(--usa-red);margin-bottom:8px;font-size:26px}
.box p{text-align:center;color:#666;margin-bottom:25px;font-size:14px}

.form-group{margin:15px 0}
.form-group label{display:block;color:var(--usa-blue);font-weight:bold;margin-bottom:6px;font-size:14px}
.form-group input{width:100%;padding:14px;border:2px solid #ddd;border-radius:10px;font-size:15px}
.form-group input:focus{border-color:var(--usa-red);outline:none}

.btn{width:100%;padding:15px;background:var(--usa-red);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn:hover{background:#a50e1f}

.link{text-align:center;margin-top:20px;font-size:14px}
.link a{color:var(--usa-blue);font-weight:bold;text-decoration:none}
</style>
</head>
<body>

<div class="box">
  <h2>Welcome Back</h2>
  <p>Login to your Wealtace Account</p>

  <form onsubmit="login(event)">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" required>
    </div>
    <button class="btn">Login</button>
  </form>

  <div class="link">Don't have an account? <a href="signup.html">Sign Up Here</a></div>
</div>

<script>
function login(e){
  e.preventDefault();
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;
  let user = JSON.parse(localStorage.getItem("wealtace_user"));
  
  if(user && user.email === email && user.password === password){
    localStorage.setItem("wealtace_email", email);
    alert("Login Successful!");
    window.location.href = "dashboard.html";
  } else {
    alert("Invalid Email or Password!");
  }
}
</script>

</body>
</html>
