<!DOCTYPE html>
<html lang="en">
<head>
<title>Wealtace Login</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="UTF-8">
<style>
:root{--cr-blue:#002B7F;--cr-red:#CE1126;--cr-green:#28a745;}
body{margin:0;font-family:'Segoe UI',Arial;background:#F0F4FF;display:flex;justify-content:center;align-items:center;height:100vh}
.login-box{background:#fff;padding:40px 30px;border-radius:12px;box-shadow:0 4px 20px rgba(0,43,127,0.1);width:90%;max-width:400px;border-top:5px solid var(--cr-red)}
.login-box h2{text-align:center;color:var(--cr-blue);margin-bottom:25px}
.login-box input{width:100%;padding:14px;margin:10px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
.login-box button{width:100%;padding:14px;background:var(--cr-blue);color:#fff;border:none;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer}
.logo{text-align:center;font-size:22px;font-weight:bold;color:var(--cr-blue);margin-bottom:15px}
.link{text-align:center;margin-top:15px;font-size:14px}
.link a{color:var(--cr-blue);text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">🇺🇸 WEALTACE 🇨🇷</div>
  <h2>Client Login</h2>
  <form action="index.html" method="post">
    <input type="email" placeholder="Email Address" required>
    <input type="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>
  <div class="link">Don't have an account? <a href="signup.html">Sign Up</a></div>
</div>
</body>
</html>
