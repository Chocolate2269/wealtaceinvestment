<!DOCTYPE html>
<html>
<head><title>Admin Panel</title>
<style>
body{background:#111;color:#fff;font-family:Arial;padding:20px}
table{width:100%;background:#222;border-collapse:collapse}
th,td{padding:12px;border:1px solid #444;text-align:left}
th{background:#3C3B6E}
input{padding:8px}
.btn{background:#28a745;color:#fff;border:none;padding:8px 12px;cursor:pointer;border-radius:5px}
</style>
</head>
<body>
<h1>🇺🇸 Admin Panel - Credit Users</h1>
<table id="userTable">
<tr><th>Name</th><th>Email</th><th>Balance</th><th>Credit User</th></tr>
</table>

<script>
function loadUsers(){
  let users = JSON.parse(localStorage.getItem("users")) || [];
  let table = document.getElementById("userTable");
  table.innerHTML = "<tr><th>Name</th><th>Email</th><th>Balance</th><th>Credit User</th></tr>";

  users.forEach((u) => {
    table.innerHTML += `
    <tr>
      <td>${u.name}</td>
      <td>${u.email}</td>
      <td>$${parseFloat(u.balance).toFixed(2)}</td>
      <td>
        <input type="number" id="add_${u.email}" placeholder="100">
        <button class="btn" onclick="addBalance('${u.email}')">Add</button>
      </td>
    </tr>`;
  });
}

function addBalance(email){
  let users = JSON.parse(localStorage.getItem("users")) || [];
  let amount = parseFloat(document.getElementById("add_"+email).value);

  if(amount > 0){
    // find user by email
    let userIndex = users.findIndex(u => u.email === email);
    if(userIndex!== -1){
      users[userIndex].balance += amount;
      localStorage.setItem("users", JSON.stringify(users));
      loadUsers();
      alert("$"+amount+" added to "+users[userIndex].name);
    }
  } else {
    alert("Enter amount greater than 0");
  }
}

loadUsers();
</script>
</body>
</html>
