<!DOCTYPE html>
<html>
<head>
<title>Admin Panel - WeltaceInvestment</title>
<script>
if(localStorage.getItem("isAdminLoggedIn")!== "true"){
  window.location.href = "admin-login.html";
}
</script>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:20px;margin:0}
h1{text-align:center;color:#3C3B6E}
.container{max-width:600px;margin:30px auto;background:#1a1a1a;padding:30px;border-radius:12px;border:1px solid #3C3B6E}
input{width:95%;padding:12px;margin:10px 0;background:#222;border:1px solid #444;color:#fff;border-radius:6px}
.btn{background:#3C3B6E;color:#fff;border:none;padding:12px 20px;cursor:pointer;border-radius:6px;font-weight:bold}
.logout{position:absolute;top:20px;right:20px;background:#ff4d4d;color:#fff;border:none;padding:8px 15px;border-radius:5px;cursor:pointer}
.success{color:#4CAF50;margin-top:10px}
</style>
</head>
<body>

<button class="logout" onclick="localStorage.removeItem('isAdminLoggedIn');location='admin-login.html'">Logout</button>

<h1>🌍 WeltaceInvestment Admin</h1>

<div class="container">
  <h2>Add Credits to User</h2>
  <input type="email" id="userEmail" placeholder="User Email" required>
  <input type="number" id="amount" placeholder="Amount $" required>
  <button class="btn" onclick="addCredit()">Add Credit</button>
  <p id="msg" class="success"></p>
</div>

<script>
function addCredit(){
  let email = document.getElementById("userEmail").value.trim();
  let amount = parseFloat(document.getElementById("amount").value);
  let msg = document.getElementById("msg");

  if(!email ||!amount){ msg.style.color="#ff4d4d"; msg.innerText="Fill all fields"; return; }

  let credits = JSON.parse(localStorage.getItem("weltace_credits")) || {};
  credits[email] = (credits[email] || 0) + amount;
  localStorage.setItem("weltace_credits", JSON.stringify(credits));

  msg.style.color="#4CAF50";
  msg.innerText=`✅ $${amount} added to ${email}`;
  document.getElementById("userEmail").value = "";
  document.getElementById("amount").value = "";
}
</script>
</body>
</html>
