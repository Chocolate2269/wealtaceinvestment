<!DOCTYPE html><html><head><title>Wealtace Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--blue:#002B7F;--red:#CE1126;--green:#28a745;--bg:#F0F4FF;}
*{margin:0;padding:0;font-family:'Segoe UI',Arial;box-sizing:border-box}
body{background:var(--bg)}
.header{background:var(--blue);color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--red)}
.logout{color:#fff;text-decoration:none;font-weight:500;background:var(--red);padding:8px 15px;border-radius:6px}
.container{max-width:500px;margin:40px auto;padding:20px}
.user-box,.balance-box{background:#fff;padding:25px;border-radius:15px;text-align:center;box-shadow:0 5px 20px rgba(0,43,127,0.1);margin-bottom:25px;border-top:5px solid var(--red)}
.balance{font-size:38px;color:var(--green);font-weight:bold}
.btn{width:100%;padding:22px;margin:12px 0;border-radius:12px;border:none;font-size:18px;font-weight:bold;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-deposit{background:var(--green)}.btn-withdraw{background:var(--red)}.btn-activate{background:var(--blue)}
</style>
</head><body>

<div class="header">
<h1>🇺🇸 WEALTACE DASHBOARD 🇨🇷</h1>
<a href="login.html" class="logout" onclick="localStorage.removeItem('wealtace_current_user')">Logout</a>
</div>

<div class="container">
<div class="user-box">
<h3 id="userName">Welcome</h3>
<p id="userEmail">email@example.com</p>
</div>

<div class="balance-box">
<h3>AVAILABLE BALANCE</h3>
<div class="balance" id="userBalance">$0.00</div>
</div>

<button class="btn btn-deposit" onclick="Tawk_API.toggle()">💰 Deposit</button>
<button class="btn btn-withdraw" onclick="Tawk_API.toggle()">🏦 Withdraw</button>
<button class="btn btn-activate" onclick="Tawk_API.toggle()">⚡ Activate Account</button>
</div>

<script>
let currentUser = JSON.parse(localStorage.getItem('wealtace_current_user'));
if(!currentUser){ window.location.href = 'login.html'; }

// Find the latest user data from the main users list
let users = JSON.parse(localStorage.getItem('wealtace_users')) || [];
let user = users.find(u => u.email === currentUser.email);

document.getElementById('userName').innerText = 'Welcome, ' + user.name;
document.getElementById('userEmail').innerText = user.email;
document.getElementById('userBalance').innerText = '$' + (user.balance || 0).toFixed(2);
</script>

<!-- Tawk.to -->
<script type="text/javascript">
var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
(function(){
var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
s1.async=true;s1.src='https://embed.tawk.to/6a7ba18a828a5d1d4789913b/1jvpeu22f';
s1.charset='UTF-8';s1.setAttribute('crossorigin','*');s0.parentNode.insertBefore(s1,s0);
})();
</script>
</body></html>
