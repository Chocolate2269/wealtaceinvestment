<!DOCTYPE html>
<html lang="en">
<head>
  <title>WeltaceInvestment USA | Crypto Investment Platform</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--usa-blue:#002B7F; --usa-red:#CE1126; --green:#28a745; --gold:#FFD700;}
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
    body{background:#F0F4FF;color:#333}
    .topbar{background:linear-gradient(90deg,var(--usa-blue) 50%,var(--usa-red) 50%);color:#fff;text-align:center;padding:14px;font-weight:bold;font-size:15px;letter-spacing:1px}
    header{background:#fff;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 3px 15px rgba(0,0,0,0.1);position:sticky;top:0;z-index:99}
    .logo{font-size:32px;font-weight:900;color:var(--usa-blue)}.logo span{color:var(--usa-red)}
    nav a{background:var(--usa-blue);color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none;margin-left:10px;font-weight:bold;transition:0.3s}
    nav a:hover{background:var(--usa-red);transform:translateY(-2px)}
    .btn-activate{background:var(--gold);color:#000 !important}
    .hero{background:linear-gradient(rgba(0,43,127,0.85),rgba(206,17,38,0.85)),url('https://flagcdn.com/w2560/us.jpg') center/cover;color:#fff;padding:120px 20px;text-align:center}
    .hero h1{font-size:48px;margin-bottom:20px;text-shadow:2px 2px 6px #000}
    .hero p{font-size:20px;margin-bottom:30px;max-width:700px;margin-left:auto;margin-right:auto}
    .btn{background:var(--green);color:#fff;padding:18px 35px;border-radius:12px;text-decoration:none;font-weight:bold;font-size:19px;display:inline-block;margin:10px;transition:0.3s}
    .btn:hover{background:var(--usa-red);transform:scale(1.05)}
    .about,.plans{padding:70px 20px;max-width:1100px;margin:auto;text-align:center;background:#fff}
    .about h2,.plans h2{color:var(--usa-blue);font-size:32px;margin-bottom:20px}
    .about p{font-size:17px;line-height:1.9;color:#444;max-width:800px;margin:auto}
