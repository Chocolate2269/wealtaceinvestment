<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wealtace Investment</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f8f9fa;
      color: #333;
    }
    header {
      background: linear-gradient(90deg,#002B7F,#CE1126);
      color: #fff;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    h1 {
      color: #002B7F;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #002B7F;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 20px;
    }
    .btn:hover {
      background: #CE1126;
    }
  </style>
</head>
<body>

  <header>
    Wealtace Investment
  </header>

  <div class="container">
    <h1>Welcome to Wealtace</h1>
    <p>Grow your wealth with trusted investment plans. Secure, transparent, and profitable.</p>
    <a href="#" class="btn">Get Started</a>
  </div>

  <!-- CHATWAY LIVE CHAT - AUTO POPUP IN 1 SECOND -->
  <script>
    // Chatway settings
    window.chatwaySettings = {
      greeting: "👋 Hi! Welcome to Wealtace Investment. How can we help you today?",
      themeColor: "#002B7F",
      position: "right"
    };

    // Auto open chat after 1 second
    window.addEventListener('load', function() {
      setTimeout(function() {
        if (window.Chatway) {
          Chatway('open');
        }
      }, 1000);
    });
  </script>

  <script id="chatway" async="true" src="https://cdn.chatway.app/widget.js?id=EDicIiTepGoB"></script>

</body>
</html>
